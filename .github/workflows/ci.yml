name: ci

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
    tags: [ 'v*' ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SBT_OPTS: "-Xmx7G -Xss4M -XX:ReservedCodeCacheSize=512M -Dsbt.server.autostart=false"
  JDK_VERSION: "21"
  LLVM_VERSION: "23"

jobs:
  tests:
    name: "${{ matrix.triple }} / tests"
    strategy:
      fail-fast: false
      matrix:
        # ONE ROW PER TARGET TRIPLE sbt-snx supports. The triple is the cell's identity and its job name; every other
        # field says how that triple is provisioned on a runner, and what the suite should expect to resolve there.
        #
        # To support a new triple, add a row. No step below needs editing unless the triple needs a toolchain this
        # workflow cannot yet install, because the steps branch on `os`/`env`, which are row data.
        #
        #   triple      the LLVM short triple `<arch>-<os>-<env>` - the identity, and what the plugin must resolve
        #   os/arch/env the plugin's own tokens, exported as SNX_EXPECT_* and used to gate steps and fixtures.
        #               `env` is our ABI token (glibc/musl/msvc/mingw), which is deliberately NOT the triple's LLVM
        #               environment token (gnu/musl/msvc/gnu) - the two vocabularies differ and both are needed.
        #   classifier  the published OS/arch classifier the suite asserts
        #   runner      the GitHub-hosted runner label
        #   dockerImage set for container cells; absent means the job runs on the host and installs its own JDK/sbt
        #
        # Renovate cannot see this matrix: its github-actions manager reads a job's `runs-on:`, `container:` and
        # `services:` fields, not matrix data. The runner labels and image tags here move by hand, together with the
        # jobs below that carry the same runner and JDK; the organisation's Renovate preset holds the JDK tag still
        # and moves only the jobs' image digests.
        include:
          - { triple: x86_64-linux-gnu, os: linux, arch: x86_64, env: glibc, classifier: linux-x86_64, runner: ubuntu-26.04, dockerImage: "shuwariafrica/el10-jdk:21" }
          - { triple: aarch64-linux-gnu, os: linux, arch: aarch64, env: glibc, classifier: linux-aarch_64, runner: ubuntu-26.04-arm, dockerImage: "shuwariafrica/el10-jdk:21" }
          - { triple: x86_64-linux-musl, os: linux, arch: x86_64, env: musl, classifier: linux-x86_64, runner: ubuntu-26.04, dockerImage: "shuwariafrica/alpine-jdk:21" }
          - { triple: aarch64-linux-musl, os: linux, arch: aarch64, env: musl, classifier: linux-aarch_64, runner: ubuntu-26.04-arm, dockerImage: "shuwariafrica/alpine-jdk:21" }
          - { triple: aarch64-apple-darwin, os: osx, arch: aarch64, env: "", classifier: osx-aarch_64, runner: macos-26 }
          - { triple: x86_64-windows-msvc, os: windows, arch: x86_64, env: msvc, classifier: windows-x86_64, runner: windows-2025-vs2026 }
          - { triple: aarch64-windows-msvc, os: windows, arch: aarch64, env: msvc, classifier: windows-aarch_64, runner: windows-11-arm }
          - { triple: x86_64-windows-gnu, os: windows, arch: x86_64, env: mingw, classifier: windows-x86_64, runner: windows-2025 }
          # openSUSE's clang reports `x86_64-suse-linux`, the only supported toolchain naming no environment
          # component, so this is the sole cell reaching the compiler-probe fallback and the failure behind it -
          # every other Linux cell resolves its ABI from the triple alone. `env: glibc` is right: the triple cannot
          # say so, but the toolchain is glibc and the probe resolves it.
          - { triple: x86_64-suse-linux, os: linux, arch: x86_64, env: glibc, classifier: linux-x86_64, runner: ubuntu-26.04, dockerImage: "shuwariafrica/opensuse-jdk:21" }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      DOCKER_IMAGE: ${{ matrix.dockerImage }}
      SNX_EXPECT_CLASSIFIER: ${{ matrix.classifier }}
      SNX_EXPECT_OS: ${{ matrix.os }}
      SNX_EXPECT_ENV: ${{ matrix.env }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: "[host] Set up Java"
        if: ${{ !matrix.dockerImage }}
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: microsoft
          java-version: ${{ env.JDK_VERSION }}
          check-latest: true
      - name: "[host] Set up sbt"
        if: ${{ !matrix.dockerImage }}
        uses: sbt/setup-sbt@67d461eba2c4753196c230e02da850757ba4775e # v1.5.14
      - name: Set up Coursier cache
        uses: coursier/cache-action@ee0650f98295f27a505e4bfd284c9bfaa913a465 # v9.0.1
      - name: Generate disposable signing key
        if: ${{ matrix.os == 'linux' }}
        shell: bash
        run: |
          export GNUPGHOME="${PWD}/.gnupg-ci"
          mkdir -p "${GNUPGHOME}"
          chmod 700 "${GNUPGHOME}"
          printf 'GNUPGHOME=%s\n' "${GNUPGHOME}" >> "${GITHUB_ENV}"
          printf 'pinentry-mode loopback\nbatch\n' > "${GNUPGHOME}/gpg.conf"
          gpg --batch --gen-key <<'EOF'
          %no-protection
          Key-Type: RSA
          Key-Length: 2048
          Name-Real: snx ci
          Name-Email: ci@snx.local
          Expire-Date: 0
          %commit
          EOF
      - name: "[macOS] Install LLVM"
        if: ${{ matrix.os == 'osx' }}
        shell: bash
        run: |
          brew update
          brew install "llvm@${LLVM_VERSION}"
          prefix=$(brew --prefix "llvm@${LLVM_VERSION}")
          printf '%s/bin\n' "${prefix}" >> "${GITHUB_PATH}"
      - name: "[Windows] Set up MSVC"
        if: ${{ matrix.os == 'windows' && matrix.env == 'msvc' }}
        shell: pwsh
        run: |
          $arch = if ('${{ matrix.arch }}' -eq 'aarch64') { 'arm64' } else { 'amd64' }
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
                  -latest -property installationPath
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvarsall.bat`" $arch && set" |
            ForEach-Object { if ($_ -match '^([^=]+)=(.*)$') { "$($Matches[1])=$($Matches[2])" } } |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: "[Windows] Set up MinGW (clang64)"
        if: ${{ matrix.os == 'windows' && matrix.env == 'mingw' }}
        shell: pwsh
        run: |
          # SN selects clang via LLVM_BIN (Discover.discover -> `where "$LLVM_BIN:clang.exe"`), so pointing it at the
          # MSYS2 clang64 toolchain (which targets x86_64-w64-windows-gnu) forces the MinGW path and bypasses the
          # MSVC-targeting system clang entirely. vcvarsall is intentionally NOT run for this cell.
          C:\msys64\usr\bin\pacman -S --needed --noconfirm mingw-w64-clang-x86_64-toolchain
          # Scala Native 0.5.12 declares `typedef int pid_t` for every Windows target (gc/shared/ThreadUtil.h), while
          # mingw-w64 headers from 14.0.0.r302 on reach their own 64-bit pid_t through <wchar.h>, so no Scala Native
          # program compiles against them. Hold the headers at the last package before that change until a Scala
          # Native release stops declaring pid_t on MinGW.
          C:\msys64\usr\bin\pacman -U --noconfirm https://repo.msys2.org/mingw/clang64/mingw-w64-clang-x86_64-headers-14.0.0.r283.ga7cb47123-1-any.pkg.tar.zst
          "LLVM_BIN=C:\msys64\clang64\bin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "C:\msys64\clang64\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: "[${{ matrix.triple }}] Unit tests"
        shell: bash
        # `testOnly *` rather than `test`: under sbt 2.x `test` resolves through `testQuick`, which skips any suite
        # holding a success record in the disk action cache that setup-sbt restores between runs. A run whose sources
        # are unchanged would then execute nothing and still report green. Forcing execution costs build time only -
        # the restored cache still accelerates compilation. These are the plugin's own JVM suites, so the linked-binary
        # test digest does not cover them.
        run: ./project/scripts/run-sbt.sh -batch "testOnly *"
      - name: "[${{ matrix.triple }}] Scripted tests"
        shell: bash
        run: ./project/scripts/run-sbt.sh -batch "scripted"

  static-analysis:
    name: analyse
    runs-on: ubuntu-26.04
    container: shuwariafrica/el10-jdk:21@sha256:06f9ac141b63cd2205a19437b37ba0ee38d92709eddbbf18e954a2cba53ea8cd
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Coursier cache
        uses: coursier/cache-action@ee0650f98295f27a505e4bfd284c9bfaa913a465 # v9.0.1
      - name: Verify Source Formatting
        id: scalafmt
        continue-on-error: true
        run: sbt --server -batch scalafmtCheckAll scalafmtSbtCheck
      - name: Verify Linting Conformity
        id: scalafix
        continue-on-error: true
        run: sbt --server -batch "scalafixAll --check"
      - name: Verify File Header Conformity
        id: headers
        continue-on-error: true
        run: sbt --server -batch headerCheckAll
      - name: Check for failures
        if: always()
        env:
          FMT_OUTCOME: ${{ steps.scalafmt.outcome }}
          FIX_OUTCOME: ${{ steps.scalafix.outcome }}
          HDR_OUTCOME: ${{ steps.headers.outcome }}
        run: |
          failed=""
          if [[ "${FMT_OUTCOME}" == "failure" ]]; then failed="${failed} scalafmtCheckAll"; fi
          if [[ "${FIX_OUTCOME}" == "failure" ]]; then failed="${failed} scalafixAll"; fi
          if [[ "${HDR_OUTCOME}" == "failure" ]]; then failed="${failed} headerCheckAll"; fi
          if [[ -n "${failed}" ]]; then
            printf '::error::Static analysis checks failed:%s\n' "${failed}"
            exit 1
          fi
      - name: Verify scripts are executable
        shell: bash
        run: |
          for script in release project/scripts/run-sbt.sh; do
            mode=$(git ls-files --stage -- "${script}" | cut -d ' ' -f 1)
            if [[ "${mode}" != 100755 ]]; then
              printf '::error::%s is committed as %s; make it executable with: git update-index --chmod=+x %s\n' "${script}" "${mode:-untracked}" "${script}"
              exit 1
            fi
          done

  # The repository's own shell: the workflows' run blocks, release and run-sbt.sh. actionlint calls ShellCheck with
  # --norc, so the .shellcheckrc baseline reaches the run blocks only through SHELLCHECK_OPTS. The actionlint image has
  # no git, so actionlint is named its configuration, and the image's own user cannot write the runner's work directory.
  lint:
    name: lint / workflows and scripts
    runs-on: ubuntu-26.04
    container:
      image: docker.io/rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
      options: --user root
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint workflows
        env:
          SHELLCHECK_OPTS: --enable=all
        run: actionlint -config-file .github/actionlint.yaml .github/workflows/*.yml
      - name: Lint scripts
        run: shellcheck release project/scripts/run-sbt.sh

  format:
    name: format / scripts
    runs-on: ubuntu-26.04
    container: docker.io/mvdan/shfmt:v3.14.1-alpine@sha256:c7a0dfa73dfea80e9d9e185c655b44759eea2df85dec142295bcc0bb600c6266
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check script formatting
        run: shfmt -d release project/scripts/run-sbt.sh

  publish:
    name: publish
    needs: [ tests, static-analysis ]
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
    runs-on: ubuntu-26.04
    container: shuwariafrica/el10-jdk:21@sha256:06f9ac141b63cd2205a19437b37ba0ee38d92709eddbbf18e954a2cba53ea8cd
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Import signing key
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.OSS_PUBLISH_USER_SIGNING_KEY }}
      - name: Set up Coursier cache
        uses: coursier/cache-action@ee0650f98295f27a505e4bfd284c9bfaa913a465 # v9.0.1
      - name: ${{ startsWith(github.ref, 'refs/tags/v') && 'Assemble Release' || 'Publish Snapshots' }}
        run: sbt --server -batch publishSigned
        env:
          SONATYPE_USERNAME: ${{ secrets.OSS_PUBLISH_USER }}
          SONATYPE_PASSWORD: ${{ secrets.OSS_PUBLISH_USER_PASSPHRASE }}
      - name: Maven Central Release
        if: startsWith(github.ref, 'refs/tags/v')
        run: sbt --server -batch sonaUpload sonaRelease
        env:
          SONATYPE_USERNAME: ${{ secrets.OSS_PUBLISH_USER }}
          SONATYPE_PASSWORD: ${{ secrets.OSS_PUBLISH_USER_PASSPHRASE }}

  release:
    name: release
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Mint Release Bot Token
        id: release-bot
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ steps.release-bot.outputs.token }}
          TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          flags=(--generate-notes --verify-tag)
          if [[ "${TAG}" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "${TAG}" --repo "${REPOSITORY}" --title "${TAG}" "${flags[@]}"
