name: ci

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
    tags: [ 'v*' ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SBT_OPTS: "-Xmx7G -Xss4M -XX:ReservedCodeCacheSize=512M -Dsbt.server.autostart=false"
  JDK_VERSION: "21"
  LLVM_VERSION: "22"

jobs:
  tests:
    name: "${{ matrix.triple }} / tests"
    strategy:
      fail-fast: false
      matrix:
        # ONE ROW PER TARGET TRIPLE sbt-snx supports. The triple is the cell's identity and its job name; every other
        # field says how that triple is provisioned on a runner, and what the suite should expect to resolve there.
        #
        # To support a new triple, add a row. No step below needs editing unless the triple needs a toolchain this
        # workflow cannot yet install, because the steps branch on `os`/`env`, which are row data.
        #
        #   triple      the LLVM short triple `<arch>-<os>-<env>` - the identity, and what the plugin must resolve
        #   os/arch/env the plugin's own tokens, exported as SNX_EXPECT_* and used to gate steps and fixtures.
        #               `env` is our ABI token (glibc/musl/msvc/mingw), which is deliberately NOT the triple's LLVM
        #               environment token (gnu/musl/msvc/gnu) - the two vocabularies differ and both are needed.
        #   classifier  the published OS/arch classifier the suite asserts
        #   runner      the GitHub-hosted runner label
        #   dockerImage set for container cells; absent means the job runs on the host and installs its own JDK/sbt
        #
        # Renovate cannot see these image tags: its github-actions manager reads a job's `container:`/`services:`
        # fields, not matrix data, so the JDK baseline moves here by hand. The `container:` jobs below hold the same
        # pin and are held still by an organisation rule, so the two must be changed together.
        include:
          - { triple: x86_64-linux-gnu, os: linux, arch: x86_64, env: glibc, classifier: linux-x86_64, runner: ubuntu-24.04, dockerImage: "shuwariafrica/el10-jdk:21" }
          - { triple: aarch64-linux-gnu, os: linux, arch: aarch64, env: glibc, classifier: linux-aarch_64, runner: ubuntu-24.04-arm, dockerImage: "shuwariafrica/el10-jdk:21" }
          - { triple: x86_64-linux-musl, os: linux, arch: x86_64, env: musl, classifier: linux-x86_64, runner: ubuntu-24.04, dockerImage: "shuwariafrica/alpine-jdk:21" }
          - { triple: aarch64-linux-musl, os: linux, arch: aarch64, env: musl, classifier: linux-aarch_64, runner: ubuntu-24.04-arm, dockerImage: "shuwariafrica/alpine-jdk:21" }
          - { triple: aarch64-apple-darwin, os: osx, arch: aarch64, env: "", classifier: osx-aarch_64, runner: macos-26 }
          - { triple: x86_64-windows-msvc, os: windows, arch: x86_64, env: msvc, classifier: windows-x86_64, runner: windows-2025-vs2026 }
          - { triple: aarch64-windows-msvc, os: windows, arch: aarch64, env: msvc, classifier: windows-aarch_64, runner: windows-11-arm }
          - { triple: x86_64-windows-gnu, os: windows, arch: x86_64, env: mingw, classifier: windows-x86_64, runner: windows-2025 }
          # openSUSE's clang reports `x86_64-suse-linux`, the only supported toolchain naming no environment
          # component, so this is the sole cell reaching the compiler-probe fallback and the failure behind it -
          # every other Linux cell resolves its ABI from the triple alone. `env: glibc` is right: the triple cannot
          # say so, but the toolchain is glibc and the probe resolves it.
          - { triple: x86_64-suse-linux, os: linux, arch: x86_64, env: glibc, classifier: linux-x86_64, runner: ubuntu-24.04, dockerImage: "shuwariafrica/opensuse-jdk:21" }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      DOCKER_IMAGE: ${{ matrix.dockerImage }}
      SNX_EXPECT_CLASSIFIER: ${{ matrix.classifier }}
      SNX_EXPECT_OS: ${{ matrix.os }}
      SNX_EXPECT_ENV: ${{ matrix.env }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: "[host] Set up Java"
        if: ${{ !matrix.dockerImage }}
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: microsoft
          java-version: ${{ env.JDK_VERSION }}
          check-latest: true
      - name: "[host] Set up sbt"
        if: ${{ !matrix.dockerImage }}
        uses: sbt/setup-sbt@bfea3c5f48abd221b04a6df4798aa5eb8b6a2baf # v1.5.6
      - name: Set up Coursier cache
        uses: coursier/cache-action@95e5b1029b6b86e7bac033ee44a0697d8a527d2d # v8
      - name: Generate disposable signing key
        if: ${{ matrix.os == 'linux' }}
        shell: bash
        run: |
          export GNUPGHOME="$PWD/.gnupg-ci"
          mkdir -p "$GNUPGHOME"; chmod 700 "$GNUPGHOME"
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          printf 'pinentry-mode loopback\nbatch\n' > "$GNUPGHOME/gpg.conf"
          gpg --batch --gen-key <<'EOF'
          %no-protection
          Key-Type: RSA
          Key-Length: 2048
          Name-Real: snx ci
          Name-Email: ci@snx.local
          Expire-Date: 0
          %commit
          EOF
      - name: "[macOS] Install LLVM"
        if: ${{ matrix.os == 'osx' }}
        shell: bash
        run: |
          brew update
          brew install "llvm@${LLVM_VERSION}"
          echo "$(brew --prefix "llvm@${LLVM_VERSION}")/bin" >> "$GITHUB_PATH"
      - name: "[Windows] Set up MSVC"
        if: ${{ matrix.os == 'windows' && matrix.env == 'msvc' }}
        shell: pwsh
        run: |
          $arch = if ('${{ matrix.arch }}' -eq 'aarch64') { 'arm64' } else { 'amd64' }
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
                  -latest -property installationPath
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvarsall.bat`" $arch && set" |
            ForEach-Object { if ($_ -match '^([^=]+)=(.*)$') { "$($Matches[1])=$($Matches[2])" } } |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: "[Windows] Set up MinGW (clang64)"
        if: ${{ matrix.os == 'windows' && matrix.env == 'mingw' }}
        shell: pwsh
        run: |
          # SN selects clang via LLVM_BIN (Discover.discover -> `where "$LLVM_BIN:clang.exe"`), so pointing it at the
          # MSYS2 clang64 toolchain (which targets x86_64-w64-windows-gnu) forces the MinGW path and bypasses the
          # MSVC-targeting system clang entirely. vcvarsall is intentionally NOT run for this cell.
          C:\msys64\usr\bin\pacman -S --needed --noconfirm mingw-w64-clang-x86_64-toolchain
          "LLVM_BIN=C:\msys64\clang64\bin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "C:\msys64\clang64\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: "[${{ matrix.triple }}] Unit tests"
        shell: bash
        # `testOnly *` rather than `test`: under sbt 2.x `test` resolves through `testQuick`, which skips any suite
        # holding a success record in the disk action cache that setup-sbt restores between runs. A run whose sources
        # are unchanged would then execute nothing and still report green. Forcing execution costs build time only -
        # the restored cache still accelerates compilation. These are the plugin's own JVM suites, so the linked-binary
        # test digest does not cover them.
        run: ./project/scripts/run-sbt.sh -batch "testOnly *"
      - name: "[${{ matrix.triple }}] Scripted tests"
        shell: bash
        run: ./project/scripts/run-sbt.sh -batch "scripted"

  static-analysis:
    name: analyse
    runs-on: ubuntu-24.04
    container: shuwariafrica/el10-jdk:21
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Set up Coursier cache
        uses: coursier/cache-action@95e5b1029b6b86e7bac033ee44a0697d8a527d2d # v8
      - name: Verify Source Formatting
        id: scalafmt
        continue-on-error: true
        run: sbt --server -batch scalafmtCheckAll scalafmtSbtCheck
      - name: Verify Linting Conformity
        id: scalafix
        continue-on-error: true
        run: sbt --server -batch "scalafixAll --check"
      - name: Verify File Header Conformity
        id: headers
        continue-on-error: true
        run: sbt --server -batch headerCheckAll
      - name: Check for failures
        if: always()
        env:
          FMT_OUTCOME: ${{ steps.scalafmt.outcome }}
          FIX_OUTCOME: ${{ steps.scalafix.outcome }}
          HDR_OUTCOME: ${{ steps.headers.outcome }}
        run: |
          failed=""
          [[ "$FMT_OUTCOME" == "failure" ]] && failed="$failed scalafmtCheckAll"
          [[ "$FIX_OUTCOME" == "failure" ]] && failed="$failed scalafixAll"
          [[ "$HDR_OUTCOME" == "failure" ]] && failed="$failed headerCheckAll"
          
          if [[ -n "$failed" ]]; then
            echo "::error::Static analysis checks failed:$failed"
            exit 1
          fi

  publish:
    name: publish
    needs: [ tests, static-analysis ]
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    container: shuwariafrica/el10-jdk:21
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Import signing key
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7
        with:
          gpg_private_key: ${{ secrets.OSS_PUBLISH_USER_SIGNING_KEY }}
      - name: Set up Coursier cache
        uses: coursier/cache-action@95e5b1029b6b86e7bac033ee44a0697d8a527d2d # v8
      - name: ${{ startsWith(github.ref, 'refs/tags/v') && 'Assemble Release' || 'Publish Snapshots' }}
        run: sbt --server -batch publishSigned
        env:
          SONATYPE_USERNAME: ${{ secrets.OSS_PUBLISH_USER }}
          SONATYPE_PASSWORD: ${{ secrets.OSS_PUBLISH_USER_PASSPHRASE }}
      - name: Maven Central Release
        if: startsWith(github.ref, 'refs/tags/v')
        run: sbt --server -batch sonaUpload sonaRelease
        env:
          SONATYPE_USERNAME: ${{ secrets.OSS_PUBLISH_USER }}
          SONATYPE_PASSWORD: ${{ secrets.OSS_PUBLISH_USER_PASSPHRASE }}

  release:
    name: release
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Mint Release Bot Token
        id: release-bot
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ steps.release-bot.outputs.token }}
        run: |
          prerelease_flag=""
          if [[ "${{ github.ref_name }}" == *-* ]]; then
            prerelease_flag="--prerelease"
          fi
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            --verify-tag \
            $prerelease_flag
