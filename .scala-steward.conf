# The plugin compiles with the Scala its sbt runs on, and a plugin built on a later sbt line's Scala no longer loads
# in sbt 2.0: moving the line changes the sbt every consumer must run, so it is a decision rather than an update.
updates.pin = [ { groupId = "org.scala-sbt", artifactId = "sbt", version = "2.0." } ]
